prompt = "Brand identity aggiornata dall’utente il 15 ottobre 2026: per ogni nuovo documento, visual, animazione e revisione usa esclusivamente il Corporate Design Kit 4.1 EN verificato in docs/company/brand.md e docs/company/brand-kit.json del workspace canonico C:/Users/Operations/Documents/AI_Workspace/Business Operations/Marketing EFS, recuperato da Teams/SharePoint Marketing/Inputs/Brand Identity. Il 4.1 comprende l’aggiornamento del logo: usa soltanto logo, varianti e animazioni contenuti nel 4.1, senza recuperare asset da kit precedenti. Questa regola prevale sui riferimenti ai vecchi kit nelle memorie e nei moduli. Conserva originali, revisioni e approvazioni pregresse nel loro ambito; non rigenerare o pubblicare materiali già consegnati senza incarico. Rileggi le regole correnti prima di produrre il prossimo materiale.\n\nOgni mese prepara una sola newsletter per la Pagina LinkedIn Electrofit Systems completa nella presente chat. Decisione dell'utente del 05/10/2026: il canale esclusivo è la newsletter LinkedIn; nessuna piattaforma di mailing o lista email aziendale da configurare. Usa il workspace canonico C:/Users/Operations/Documents/AI_Workspace/Business Operations/Marketing EFS. Leggi README.md, AGENTS.md, docs/rules.md, docs/company/context.md, docs/company/sources.md, docs/company/marketing-input-folder.md, docs/company/input-approvals.md, docs/newsletter/workflow.md e docs/maintenance/teams-approvals.md. Usa la skill installata C:/Users/Operations/.codex/skills/newsletter-creation-curation/SKILL.md in modalità standard, adattata al B2B tecnico EFS Italia/Europa e alla cadenza mensile; non inventare round di finanziamento, personas, benchmark, notizie o KPI. Aggiornamento del 05/10/2026, correzione più recente: applica docs/company/marketing-input-folder.md e docs/company/input-approvals.md. La fonte comune LinkedIn/newsletter è Marketing/Inputs: https://efitsys.sharepoint.com/sites/Documentation/Shared%20Documents/General/Marketing/Inputs. I materiali esterni sono rappresentati da 67 collegamenti nativi .url nelle categorie esistenti; il kit preesistente in Inputs resta originale. Le copie create per errore sono sostituite; non copiarle né usarle. Registro corrente output/Linkedin/input-approvals/inputs-folder-shortcuts-correction-20261005-v01.json. Leggi i contenuti dal target originale usando source_url/drive_id/item_id: fetch del .url può restituire solo InternetShortcut. Nuove review native sul collegamento devono identificare anche URL, ID, versione/eTag/hash dell'originale e ambito LinkedIn/newsletter con limiti. Lo stato approvato del .url non approva automaticamente modifiche dell'originale: verifica il target prima della richiesta e del riuso. Scegli revisori verificati in Microsoft o indicati dall'utente; nessun approvatore predefinito configurato per l'intera libreria. Conserva e riconcilia decisioni Lists e richieste storiche nel servizio originale senza duplicarle o ereditare manualmente stati. La cache output/Linkedin/config/input-approvals.json e ricevute locali non autenticano una decisione. Input nuovi o revisioni pending/rejected/revoked/unknown restano esclusi da claim/media; autorizzazioni esplicite pregresse conservano il proprio ambito. Nessuna richiesta massiva automatica, nuovi permessi o link anonimi. Se target o decisioni non sono accessibili, registra awaiting_input_approval/access_blocked e copertura parziale e continua fasi indipendenti. Non inventare API, token o approvazioni. Review input sul collegamento e sulla revisione originale senza manifest input in Outputs; la review dei derivati mantiene il flusso manifest Outputs. Se mancano input approvati, prepara le parti indipendenti o una richiesta di input e registra awaiting_input_approval senza una newsletter finale incompleta. Leggi output/Newsletter/config/state.json e usa month_key Europe/Rome e lock esclusivo: una sola edizione per mese, riprendi review pendenti senza accumulare nuove edizioni, nessun recupero automatico dei mesi saltati. Produce blueprint e newsletter italiana con tre opzioni di titolo, breve sommario per LinkedIn, apertura, un tema principale, tre-cinque indicazioni pratiche e una CTA adatta a LinkedIn, come il confronto tecnico nei commenti; note interne separate con fonti, revisioni, evidenze approvazione input, limiti e autocritica. Adattamento inglese se richiesto. Salva file versionati in output/Newsletter e carica solo il PDF leggibile e gli asset essenziali nella sottocartella cloud esistente Marketing/Outputs/Newsletter, verificando metadata e contenuto. Genera il manifest categoria newsletter, review_only con scripts/maintenance/prepare_approval_request.py e caricalo per ultimo per la review nativa; approvatori gestiti nel flusso Microsoft, nessun invio in chat/DM/email. Aggiorna atomicamente lo stato e registra copertura parziale, consegna e decisione separatamente; unknown richiede riconciliazione prima del retry. Dopo approvazione finale mantieni approved_pending_linkedin_publication. Conserva separatamente l'approvazione finale e l'autorizzazione all'esecuzione della pubblicazione. Una revisione da formato email a LinkedIn richiede una nuova review della stessa edizione, preservando lo storico. La newsletter è un articolo nativo della Pagina LinkedIn EFS: il PDF serve alla review, non sostituisce l'articolo. Verifica accesso amministratore e disponibilità della funzione newsletter prima di creare la serie. Nome, descrizione e immagini della serie restano proposte locali finché la creazione è autorizzata. Nessuna creazione della serie pubblica o pubblicazione è autorizzata dalla ricorrenza. Questa ricorrenza autorizza preparazione e review: non inviare newsletter ai destinatari, non aggiungere iscritti, non modificare piattaforme, credenziali o live, non pubblicare nuovi post, non cambiare il ciclo LinkedIn, non installare pacchetti né creare nuove schedule o sottoagenti. Stay quiet when state is unchanged or non-actionable; notify only a new complete draft, meaningful change, failure or required user decision. Preparazione primo lunedì di ogni mese alle 10:00 Europe/Rome, dal 05/10/2026.\n\nRegola permanente successiva del 02/10/2026: applica docs/company/output-delivery.md a tutte le consegne. SharePoint Outputs riceve soltanto i file necessari e direttamente fruibili dal destinatario; catalogo PDF, newsletter PDF leggibile per la review, LinkedIn testo/anteprime leggibili con asset finali necessari, riuniti quando possibile. Nuovi .md, note interne, blueprint, sorgenti, configurazioni, cache, log e verifiche restano locali. Il manifest approval-request e la ricevuta approval-receipt restano indispensabili al flusso Microsoft; il manifest elenca solo i file cloud effettivi. Non caricare intere cartelle o report amministrativi. Questa regola prevale sui moduli storici e sulle precedenti istruzioni di upload del pacchetto interno completo. Conserva gli archivi preesistenti senza cancellazioni."
