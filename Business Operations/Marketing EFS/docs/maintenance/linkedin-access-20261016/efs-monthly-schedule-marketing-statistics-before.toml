prompt = "Brand identity aggiornata dall’utente il 15 ottobre 2026: per ogni nuovo documento, visual, animazione e revisione usa esclusivamente il Corporate Design Kit 4.1 EN verificato in docs/company/brand.md e docs/company/brand-kit.json del workspace canonico C:/Users/Operations/Documents/AI_Workspace/Business Operations/Marketing EFS, recuperato da Teams/SharePoint Marketing/Inputs/Brand Identity. Il 4.1 comprende l’aggiornamento del logo: usa soltanto logo, varianti e animazioni contenuti nel 4.1, senza recuperare asset da kit precedenti. Questa regola prevale sui riferimenti ai vecchi kit nelle memorie e nei moduli. Conserva originali, revisioni e approvazioni pregresse nel loro ambito; non rigenerare o pubblicare materiali già consegnati senza incarico. Rileggi le regole correnti prima di produrre il prossimo materiale.\n\nUna volta al mese prepara nella chat MASTER il recap marketing EFS del mese solare precedente, confrontato con il mese prima. Usa esclusivamente il workspace C:/Users/Operations/Documents/AI_Workspace/Business Operations/Marketing EFS e leggi README.md, AGENTS.md, docs/rules.md, docs/company/context.md, docs/company/sources.md, docs/company/output-delivery.md, docs/maintenance/master-coordination.md, docs/linkedin/measurement-and-sales.md e docs/marketing-statistics.md. Raccogli gli analytics amministratore della Pagina LinkedIn ElectroFit Systems (organizzazione 103544667) tramite integrazione verificata oppure browser in-app autenticato: esportazioni originali di contenuti, follower e visitatori, totale follower corrente, metriche post, dati demografici aggregati, comparse nelle ricerche e newsletter quando disponibili. Consulta il registro commerciale canonico e altre fonti marketing già collegate, senza trasformare clic o aziende seguite in lead. Conserva gli originali in input/Technical documentation/Marketing analytics e i temporanei in .local/maintenance/temporary. Riusa la review mensile eventualmente già prodotta dal passaggio LinkedIn quindicinale e le sue evidenze: un solo recap consolidato per month_key, nessuna duplicazione di analisi o richieste. Verifica che ogni periodo sia completo; registra date, fuso UTC degli export e ritardo dati. Impressioni, views video, views della Pagina, visitatori unici, nuovi follower e crescita netta devono restare distinti. Non sommare unici giornalieri come unici mensili; non sommare righe organico/sponsorizzato/totale dello stesso post né snapshot successivi; CTR aggregato da clic/impressioni. Confronta anche le medie giornaliere quando i mesi hanno durata diversa. Dati mancanti N.D., mai zero inventato. Crea un PDF leggibile versionato con KPI, confronto mensile, andamento, post migliori, audience e copertura dei dati in output/Statistics; snapshot, CSV, note e ricevute restano locali. Carica soltanto il PDF necessario nella sottocartella SharePoint già autorizzata General/Marketing/Outputs/Statistics sul sito Documentation efitsys.sharepoint.com e verifica metadata e contenuto. Aggiorna lo stato locale mensile e il riferimento pertinente nel registro Master, preservando archivi e decisioni. Se l'accesso è bloccato, continua con le fonti disponibili e dichiara esattamente la copertura; non inventare risultati o checkpoint completi. Nessuna pubblicazione, invito, messaggio, nuovo permesso o installazione. La ricorrenza richiesta dall'utente il 05/10/2026 riguarda soltanto raccolta, recap e consegna delle statistiche."
